<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Dandiya Night 2026 - Book Tickets</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .booking-box { background: #1e293b; padding: 28px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 1px solid #334155; }
    .badge { background: #f84464; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
    h2 { margin: 0 0 18px; font-size: 22px; }
    label { display: block; margin-top: 14px; font-size: 13px; color: #cbd5e1; font-weight: 600; }
    input, select { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #f84464; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 22px; cursor: pointer; }
    button:hover { background: #e11d48; }
  </style>
</head>
<body>

<div class="booking-box">
  <span class="badge">LIVE EVENT BOOKING</span>
  <!-- Jis website par lagayein bas us event ka naam yahan badal dein -->
  <h2 id="eventTitle">Grand Dandiya Night 2026</h2>

  <label>Your Full Name</label>
  <input type="text" id="custName" placeholder="Apna naam likhein" required>

  <label>Email Address</label>
  <input type="email" id="custEmail" placeholder="name@example.com" required>

  <label>WhatsApp / Mobile Number</label>
  <input type="tel" id="custPhone" placeholder="10-digit mobile number" maxlength="10" required>

  <label>Select Ticket Category</label>
  <select id="ticketType">
    <option value="DEMO_PASS">🔥 Demo Test Ticket - ₹1</option>
    <option value="REGULAR_PASS">Regular Entry Pass - ₹499</option>
    <option value="COUPLE_PASS">Couple Entry Pass - ₹899</option>
    <option value="VIP_PASS">VIP Front Row Pass - ₹999</option>
  </select>

  <label>Number of Tickets</label>
  <input type="number" id="ticketQty" value="1" min="1" max="10">

  <button onclick="redirectToVerifiedPayment()">Book Now & Get M-Ticket</button>
</div>

<script>
  // AAPKA VERIFIED CLOUDFLARE WORKER DOMAIN:
  const VERIFIED_PAYMENT_GATEWAY = "https://bookmy.yashrajx-inc.workers.dev/pay";

  // Agar aap danceshow.html banayein, toh bas yahan "Mega Dance Show 2026" likh dein:
  const EVENT_NAME = "Grand Dandiya Night 2026";

  function redirectToVerifiedPayment() {
    const name = document.getElementById("custName").value.trim();
    const email = document.getElementById("custEmail").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const type = document.getElementById("ticketType").value;
    const qty = document.getElementById("ticketQty").value;

    if (!name || !email || phone.length < 10) {
      alert("Kripya apna Naam, Email aur 10-digit Mobile Number sahi se bharein!");
      return;
    }

    // Yeh user ko seedha aapke Verified Worker par le jayega jahan Razorpay bina kisi domain error ke khulega!
    const params = new URLSearchParams({
      event: EVENT_NAME,
      name: name,
      email: email,
      phone: phone,
      type: type,
      qty: qty
    });

    window.location.href = `${VERIFIED_PAYMENT_GATEWAY}?${params.toString()}`;
  }
</script>

</body>
</html>
